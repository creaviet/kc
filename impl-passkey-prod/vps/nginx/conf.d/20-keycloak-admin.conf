server {
  listen 8444 ssl;
  listen [::]:8444 ssl;
  server_name kc-admin.gateway-vw.de;

  ssl_certificate     /etc/nginx/certs/kc-admin.gateway-vw.de.fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/kc-admin.gateway-vw.de.key.pem;

  # Fail closed: add explicit `allow <your-ip>;` entries in admin-allow.conf.
  include /etc/nginx/admin-allow.conf;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'none'" always;

  location / {
    include /etc/nginx/snippets/keycloak-proxy.conf;
  }
}
