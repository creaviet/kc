# ============================================================================
#  Portal SPA + API gateway: https://portal.gateway-vw.de:8443
# ============================================================================
#  - "/"        -> static files from /usr/share/nginx/portal (no build step)
#  - "/api/*"   -> Lambda handler (container "lambda", Node HTTP shim)
#  - "/healthz" -> liveness probe for the container healthcheck
#
#  The SPA is served from the same origin as /api, so no CORS preflight is
#  needed. Keep it that way (CORS_ORIGIN stays empty).
# ============================================================================

server {
    listen 8443 ssl default_server;
    http2 on;

    server_name portal.gateway-vw.de;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    root  /usr/share/nginx/portal;
    index index.html;

    # Headers are declared once at server level: `add_header` in a nested
    # location would reset the whole set.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "no-store, must-revalidate" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://kc.gateway-vw.de:8443; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://lambda:3000;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # SPA routes (e.g. /auth/callback) are resolved client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
