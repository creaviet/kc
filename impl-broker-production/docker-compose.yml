# Production-oriented topology.
# nginx terminates TLS on 8443/8444. Keycloak listens only on internal 8080.
# Secrets come from environment variables and the mounted Keycloak file vault.
# No default passwords, no start-dev.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KC_DB_DATABASE:-keycloak}
      POSTGRES_USER: ${KC_DB_USERNAME:?set KC_DB_USERNAME}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?set KC_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "5432"
    deploy:
      resources:
        limits:
          memory: 1g

  keycloak:
    build:
      context: ./keycloak/docker
    image: vw-keycloak:26.8.2-vault
    restart: unless-stopped
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: ${KC_DB_DATABASE:-keycloak}
      KC_DB_USERNAME: ${KC_DB_USERNAME:?set KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?set KC_DB_PASSWORD}

      KC_HOSTNAME: https://kc.gateway-vw.de:8443
      KC_HOSTNAME_ADMIN: https://kc-admin.gateway-vw.de:8444
      KC_HOSTNAME_STRICT: "true"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
      KC_HOSTNAME_DEBUG: "false"

      KC_PROXY_HEADERS: forwarded
      KC_PROXY_TRUSTED_ADDRESSES: ${KC_PROXY_TRUSTED_ADDRESSES:?set nginx CIDR, e.g. 172.16.0.0/12}

      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LOG_LEVEL: ${KC_LOG_LEVEL:-info}

      KC_VAULT: file
      KC_VAULT_DIR: /opt/keycloak/vault

      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?set KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set KC_BOOTSTRAP_ADMIN_PASSWORD}
    volumes:
      - ./keycloak/generated:/opt/keycloak/data/import:ro
      - ./keycloak/vault:/opt/keycloak/vault:ro
    expose:
      - "8080"
      - "9000"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2g

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/admin-allow.conf:/etc/nginx/admin-allow.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "8443:8443"
      - "8444:8444"
    depends_on:
      - keycloak
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  pgdata:
