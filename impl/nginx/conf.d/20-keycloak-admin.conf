# ============================================================================
#  Keycloak admin console: https://kc-admin.gateway-vw.de:8444
# ============================================================================
#  Separate hostname AND port so that:
#   - cookies for the admin console never travel to the public login pages,
#   - the public endpoint can be firewalled to the internet while this one is
#     restricted to an admin network.
#
#  Uncomment the allow/deny block in a real deployment.
# ============================================================================

server {
    listen 8444 ssl;
    http2 on;

    server_name kc-admin.gateway-vw.de;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # allow 10.0.0.0/8;
    # allow 192.168.0.0/16;
    # deny all;

    location / {
        proxy_pass http://keycloak:8080;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Port   $server_port;

        # Admin console uploads (realm import, themes)
        client_max_body_size 32m;
    }
}
