# ============================================================================
#  VW demo edge proxy
# ============================================================================
#  Terminates TLS for three hosts:
#    8443  kc.gateway-vw.de       -> Keycloak (public: login, broker, token)
#    8443  portal.gateway-vw.de   -> static SPA + /api/ -> Lambda
#    8444  kc-admin.gateway-vw.de -> Keycloak admin console (separate port)
#
#  Backends speak plain HTTP inside the compose network; Keycloak is started
#  with KC_HTTP_ENABLED=true and KC_PROXY_HEADERS=xforwarded so it builds all
#  external URLs from X-Forwarded-*.
# ============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    client_max_body_size 16m;

    log_format  main  '$remote_addr [$time_local] host="$host" "$request" '
                      '$status $body_bytes_sent rt=$request_time '
                      'ua="$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    gzip on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json;

    # ------------------------------------------------------------------
    # TLS baseline (certificates are mounted per server block)
    # ------------------------------------------------------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # ------------------------------------------------------------------
    # Proxy defaults
    # ------------------------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Simple brute-force brake for the demo API (production: WAF / gateway).
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
