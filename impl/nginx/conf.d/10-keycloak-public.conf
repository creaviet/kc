# ============================================================================
#  Public Keycloak endpoint: https://kc.gateway-vw.de:8443
# ============================================================================
#  Serves: /realms/vw-beav/... (auth, token, jwks, broker callbacks, account console)
#  The admin console path is *not* exposed here on purpose - Keycloak redirects
#  /admin requests to KC_HOSTNAME_ADMIN (8444).
# ============================================================================

server {
    listen 8443 ssl;
    http2 on;

    server_name kc.gateway-vw.de;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass http://keycloak:8080;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Port   $server_port;
    }
}
