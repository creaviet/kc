# Production topology on the IONOS VPS.
# nginx terminates TLS on 8443 (public) and 8444 (admin, IP-allowlisted).
# Keycloak listens only on the internal Docker network (8080 / health 9000).
# No `start-dev`, no default admin password, no plaintext DB password in git.

services:
  postgres:
    image: postgres:16-alpine
    container_name: vw-kc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KC_DB_DATABASE:?set KC_DB_DATABASE}
      POSTGRES_USER: ${KC_DB_USERNAME:?set KC_DB_USERNAME}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?set KC_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${KC_DB_USERNAME} -d ${KC_DB_DATABASE}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    expose:
      - '5432'
    deploy:
      resources:
        limits:
          memory: 1g

  keycloak:
    build:
      context: ./keycloak/docker
    image: vw-keycloak:26.8.2-vault-theme
    container_name: vw-kc
    restart: unless-stopped
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: ${KC_DB_DATABASE:?set KC_DB_DATABASE}
      KC_DB_USERNAME: ${KC_DB_USERNAME:?set KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?set KC_DB_PASSWORD}

      KC_HOSTNAME: https://kc.gateway-vw.de:8443
      KC_HOSTNAME_ADMIN: https://kc-admin.gateway-vw.de:8444
      KC_HOSTNAME_STRICT: 'true'
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'false'

      KC_PROXY_HEADERS: forwarded
      KC_PROXY_TRUSTED_ADDRESSES: ${KC_PROXY_TRUSTED_ADDRESSES:?set Docker nginx CIDR, e.g. 172.16.0.0/12}

      KC_HTTP_ENABLED: 'true'
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'true'
      KC_LOG_LEVEL: ${KC_LOG_LEVEL:-info}

      KC_VAULT: file
      KC_VAULT_DIR: /opt/keycloak/vault

      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?set bootstrap admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set bootstrap admin password}
    volumes:
      - ./keycloak/generated:/opt/keycloak/data/import:ro
      - ./keycloak/vault:/opt/keycloak/vault:ro
    expose:
      - '8080'
      - '9000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "bash -c 'echo > /dev/tcp/127.0.0.1/9000'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2g

  nginx:
    image: nginx:1.27-alpine
    container_name: vw-kc-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/admin-allow.conf:/etc/nginx/admin-allow.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - '8443:8443'
      - '8444:8444'
    depends_on:
      keycloak:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  pgdata:
