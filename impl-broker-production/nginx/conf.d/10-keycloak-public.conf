# Public Keycloak: https://kc.gateway-vw.de:8443
# Only realm/login/resources paths are needed here. Admin paths are blocked.

server {
    listen 8443 ssl default_server;
    http2 on;
    server_name _;
    return 444;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name kc.gateway-vw.de;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    limit_req zone=kc_general burst=120 nodelay;

    # The admin console must never be reachable through the public hostname.
    location ~ ^/(admin|admin/|admin/.*) {
        return 404;
    }

    location ~ ^/realms/[^/]+/protocol/openid-connect/auth$ {
        limit_req zone=kc_auth burst=20 nodelay;
        include /etc/nginx/snippets/keycloak-proxy.conf;
    }

    location ~ ^/realms/[^/]+/login-actions/ {
        limit_req zone=kc_auth burst=20 nodelay;
        include /etc/nginx/snippets/keycloak-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/keycloak-proxy.conf;
    }
}
