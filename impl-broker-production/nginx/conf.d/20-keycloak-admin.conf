# Admin console: https://kc-admin.gateway-vw.de:8444
# Separate hostname + port. Deny by default; only admin-allow.conf may add IPs.

server {
    listen 8444 ssl default_server;
    http2 on;
    server_name _;
    return 444;
}

server {
    listen 8444 ssl;
    http2 on;
    server_name kc-admin.gateway-vw.de;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    include /etc/nginx/admin-allow.conf;
    deny all;

    limit_req zone=kc_general burst=60 nodelay;

    location / {
        include /etc/nginx/snippets/keycloak-proxy.conf;
    }
}
