server {
  listen 8443 ssl;
  listen [::]:8443 ssl;
  server_name kc.gateway-vw.de;

  ssl_certificate     /etc/nginx/certs/kc.gateway-vw.de.fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/kc.gateway-vw.de.key.pem;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'none'" always;

  location / {
    include /etc/nginx/snippets/keycloak-proxy.conf;
  }

  # Health endpoint for external monitoring (Keycloak management port).
  location = /health/ready {
    proxy_pass http://keycloak:9000/health/ready;
    access_log off;
  }
}
